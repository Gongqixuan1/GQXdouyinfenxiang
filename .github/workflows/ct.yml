name: Compress Teacher
on:
  push:
    paths:
      - '.ct-trigger'
jobs:
  ct:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compress
        run: |
          python3 -c "
from PIL import Image
img = Image.open('teacher.png')
if img.mode == 'RGBA':
    bg = Image.new('RGB', img.size, (255,255,255))
    bg.paste(img, mask=img.split()[3])
    img = bg
img.thumbnail((1200, 1200), Image.LANCZOS)
img.save('teacher.jpg', 'JPEG', quality=82, optimize=True)
print('done')
"
          sed -i 's/teacher\.png/teacher.jpg/g' index.html
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add teacher.jpg index.html
          git commit -m "perf: compress teacher"
          git push
          rm -f .ct-trigger
          git add .ct-trigger
          git commit -m "cleanup" || true
          git push || true
