name: Update Role Images
on:
  push:
    paths:
      - '.update-images-trigger'
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download new images
        run: |
          curl -sL -o climbing.jpg "https://aka.doubaocdn.com/s/c5oOm8R7R8"
          curl -sL -o designer.jpg "https://aka.doubaocdn.com/s/Cz4JkzRgbO"
          curl -sL -o childcare.png "https://aka.doubaocdn.com/s/MNi8z0gtIB"
          ls -la *.jpg *.png
      - name: Update childcare reference to png
        run: |
          sed -i 's/childcare.jpg/childcare.png/g' index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add climbing.jpg designer.jpg childcare.png index.html
          git commit -m "feat: update role images" || echo "nothing to commit"
          git push
      - name: Cleanup
        run: |
          rm -f .update-images-trigger
          git add .update-images-trigger
          git commit -m "chore: cleanup" || true
          git push || true
