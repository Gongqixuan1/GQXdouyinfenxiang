name: Run Fix V2
on:
  push:
    paths:
      - '.fixv2-trigger'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run script
        run: python3 fix_v2.py
      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html note-01.html
          git commit -m "fix: remove skills section and condense note"
          git push
          rm -f .fixv2-trigger
          git add .fixv2-trigger
          git commit -m "cleanup" || true
          git push || true
