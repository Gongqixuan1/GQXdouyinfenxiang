name: Run Fix Script
on:
  push:
    paths:
      - '.run-fix-trigger'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run fix script
        run: python3 fix_all.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add teacher.jpg index.html
          git commit -m "perf: compress teacher image"
          git push
      - name: Cleanup
        run: |
          rm -f .run-fix-trigger
          git add .run-fix-trigger
          git commit -m "chore: cleanup" || true
          git push || true
