name: Copy Role Images
on:
  push:
    paths:
      - '.copy-role-trigger'
jobs:
  copy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download images
        run: |
          curl -sL -o climbing.jpg "https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/backup-before-interactive-features/climbing.jpg"
          curl -sL -o childcare.jpg "https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/backup-before-interactive-features/childcare.jpg"
          curl -sL -o "designer.jpg" "https://raw.githubusercontent.com/Gongqixuan1/rongrong-portfolio/backup-before-interactive-features/%E5%B0%81%E9%9D%A2%E8%AE%BE%E8%AE%A1%E5%B8%88%E9%85%8D%E5%9B%BE.jpg"
          ls -la *.jpg
      - name: Fix designer image reference in HTML
        run: |
          sed -i 's/封面设计师配图.jpg/designer.jpg/g' index.html
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.jpg index.html
          git commit -m "feat: add role images and fix designer filename" || echo "nothing to commit"
          git push
      - name: Cleanup
        run: |
          rm -f .copy-role-trigger
          git add .copy-role-trigger
          git commit -m "chore: cleanup" || true
          git push || true
