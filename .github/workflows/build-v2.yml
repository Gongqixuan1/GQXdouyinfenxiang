name: Build Public Portfolio V2
on:
  push:
    paths:
      - '.build2-trigger'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build site with Python
        run: python3 build.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html note-01.html build.py
          git commit -m "feat: 隐私改造版个人网站上线" || echo "nothing to commit"
          git push
      - name: Cleanup
        run: |
          rm -f .build2-trigger
          git add .build2-trigger
          git commit -m "chore: cleanup" || true
          git push || true
